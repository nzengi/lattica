[workspace]
resolver = "2"
members = [
    "crates/shred",
    "crates/reedsol",
    "crates/lthash",
    "crates/listener",
    "crates/attest",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["nzengi <zkdaofun@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/nzengi/lattica"

[workspace.dependencies]
# Crypto
ed25519-dalek = { version = "2.1", features = ["batch"] }
sha2 = "0.10"
blake3 = "1.5"
# Erasure coding
reed-solomon-erasure = { version = "6.0", features = ["simd-accel"] }
# Serde + bytes
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
bytemuck = { version = "1.16", features = ["derive"] }
# Errors / utils
thiserror = "1.0"
hex = "0.4"
# Async runtime (for listener)
tokio = { version = "1.40", features = ["full"] }
# HTTP + JSON for the RPC client
ureq = { version = "2.10", features = ["tls", "json"] }
serde_json = "1.0"
base64 = "0.22"
bs58 = "0.5"
getrandom = "0.2"
# Local crates
lattica-shred  = { path = "crates/shred" }
lattica-reedsol = { path = "crates/reedsol" }
lattica-lthash = { path = "crates/lthash" }
