[package]
name = "lattica-wasm-verify"
version.workspace = true
edition.workspace = true
description = "LATTICA — WASM bindings for verify_slot_delta (browser/Node light client)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lattica-lthash.workspace = true
lattica-attest = { path = "../attest" }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
hex.workspace = true

[features]
default = []
